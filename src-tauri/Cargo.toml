[package]
name = "radar_dj"
version = "1.0.0"
description = "App de escritorio para DJs: sugerencias Camelot, biblioteca local y drag-and-drop a Rekordbox"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "radar_dj"
path = "src/main.rs"
